name: trading-system
channels:
  - conda-forge
  - defaults

dependencies:
  # Python version
  - python=3.11

  # Core dependencies available through conda
  - pip>=24.0

  # TA-Lib - MUCH easier with conda!
  - ta-lib=0.4.28

  # Data Processing
  - pandas=2.1.4
  - numpy=1.26.2
  - pyarrow=14.0.1

  # Visualization
  - matplotlib=3.8.2
  - seaborn=0.13.0

  # Configuration & Utils
  - pyyaml=6.0.1
  - aiohttp>=3.10.11
  - websockets=12.0

  # Testing
  - pytest=7.4.3
  - pytest-asyncio=0.21.1

  # Install remaining dependencies via pip
  - pip:
      # Binance API
      - python-binance==1.0.19
      - ccxt==4.5.12

      # Technical Analysis
      - ta==0.11.0

      # Backtesting
      - backtrader==1.9.78.123
      - vectorbt==0.26.0

      # LLM Integration
      - anthropic==0.18.1
      - openai==1.12.0

      # Notifications
      - python-telegram-bot==20.7
      - pygame==2.5.2

      # Additional Visualization
      - plotly==5.18.0
      - mplfinance==0.12.10b0

      # Additional Utils
      - python-dotenv==1.0.0
      - schedule==1.2.0
      - loguru==0.7.2
